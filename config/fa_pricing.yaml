# Price table for scripts/fa_estimate.py (Persian channel, branch fa).
# Refresh with: python scripts/fa_pricing_update.py
# The estimator warns when `updated` is older than max_age_days.
# USD. Images: per image by size. TTS and LLM: per 1M tokens.
version: 1
updated: '2026-11-04'
source: https://api.avalai.ir/public/models
max_age_days: 14
images:
  avalai:
    gemini-3.1-flash-image: {1K: 0.0672, 2K: 0.101, 4K: 0.151}
    gemini-3.1-flash-lite-image: {1K: 0.0336, 2K: 0.0672, 4K: 0.1344}
    gemini-3-pro-image: {1K: 0.134, 2K: 0.134, 4K: 0.24}
tts:
  avalai:
    # AvalAI's promotional rate for the 3.8 TTS models ends 2026-12-31
    # (tools/audio/avalai_gemini_tts.py); the catalog shows the promo rate.
    gemini-3.8-flash-tts: {input: 0.5, output: 9.0}
    gemini-3.8-flash-lite-tts: {input: 0.5, output: 6.0}
llm:
  avalai:
    claude-haiku-5-5: {input: 0.1, output: 0.5}
    claude-sonnet-5-5: {input: 2.0, output: 10.0}
    claude-opus-5-5: {input: 4.0, output: 20.0}
    gemini-3.1-flash-lite: {input: 0.25, output: 1.5}
    gemini-3.8-flash: {input: 0.75, output: 3.75}
    deepseek-v4.1-flash: {input: 0.15, output: 0.6}
    qwen3.8-flash: {input: 0.15, output: 0.47}
    kimi-k2.6: {input: 0.95, output: 4.0}
    kimi-k3.1-pro: {input: 2.0, output: 10.0}
# Fitted from the Samsung sample (docs/fa/BASELINE.md): 6.6 s and 7.76 s of
# narration billed $0.001499 and $0.001764 at $9/M audio tokens.
assumptions:
  tts_audio_tokens_per_second: 25
  tts_prompt_overhead_tokens: 40
  persian_letters_per_second: 9.8
  image_seconds_avalai: 11
  tts_seconds_per_line: 5
  seconds_per_image: 6
