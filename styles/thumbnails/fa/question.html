<!-- Variant "question": a cobalt ring on the object that carries the twist,
     a short question top-right and an arrow from the words to the ring. -->
<style>
  .shade {
    position: absolute; inset: 0;
    background: linear-gradient(to left, rgba(12, 9, 6, 0.74) 0%, rgba(12, 9, 6, 0.30) 34%, rgba(12, 9, 6, 0) 52%);
  }
  .ring {
    position: absolute;
    left: ${ring_left}px; top: ${ring_top}px; width: ${ring_d}px; height: ${ring_d}px;
    box-sizing: border-box; border-radius: 50%;
    border: 14px solid var(--accent);
    box-shadow: 0 0 0 7px var(--ink), inset 0 0 0 5px var(--ink), 0 10px 30px rgba(0, 0, 0, 0.45);
  }
  .block {
    position: absolute; top: 36px; right: 52px;
    display: flex; flex-direction: column; align-items: flex-start; gap: 4px;
    direction: rtl;
  }
  .headline {
    font-weight: 900; line-height: 1.22; color: var(--ink);
    --stroke-w: 16px;
    text-shadow: 0 8px 22px rgba(0, 0, 0, 0.55);
  }
  .kicker { margin-top: 8px; font-weight: 800; line-height: 1.3; color: var(--ink); --stroke-w: 11px; }
  svg.arrow { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
</style>
<div class="shade"></div>
<div class="ring" id="ring"$ring_hidden></div>
<svg class="arrow" id="arrow" viewBox="0 0 ${width} ${height}"></svg>
<div class="block" id="words">
$headline_html
$kicker_html
</div>
<script>
  window.afterFit = function () {
    const ring = document.getElementById("ring");
    if (ring.hidden) return;
    const w = document.getElementById("words").getBoundingClientRect();
    const r = ring.getBoundingClientRect();
    const cx = (r.left + r.right) / 2, cy = (r.top + r.bottom) / 2, rad = r.width / 2 + 16;
    // From under the words to the ring's edge; no arrow when they almost touch.
    const sx = Math.min(Math.max(cx, w.left + 40), w.right - 40), sy = w.bottom + 12;
    if (Math.hypot(sx - cx, sy - cy) - rad < 90) return;
    const ang = Math.atan2(sy - cy, sx - cx);
    const ex = cx + Math.cos(ang) * rad, ey = cy + Math.sin(ang) * rad;
    const mx = (sx + ex) / 2 + (ey - sy) * 0.25, my = (sy + ey) / 2 - (ex - sx) * 0.25;
    const head = 34, a = Math.atan2(ey - my, ex - mx);
    const tip = (d) => (ex - head * Math.cos(a + d)) + "," + (ey - head * Math.sin(a + d));
    const path = "M" + sx + "," + sy + " Q" + mx + "," + my + " " + ex + "," + ey;
    const svg = document.getElementById("arrow");
    svg.innerHTML =
      '<path d="' + path + '" fill="none" stroke="var(--outline)" stroke-width="26" stroke-linecap="round"/>' +
      '<path d="' + path + '" fill="none" stroke="var(--ink)" stroke-width="14" stroke-linecap="round"/>' +
      '<polygon points="' + ex + "," + ey + " " + tip(0.45) + " " + tip(-0.45) +
      '" fill="var(--ink)" stroke="var(--outline)" stroke-width="6" stroke-linejoin="round"/>';
  };
</script>
