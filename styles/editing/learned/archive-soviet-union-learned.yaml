hook_formula:
  duration_seconds: 30.0
  beats:
  - Open on the dramatic endpoint with precise temporal specificity.
  - Sharpen the mystery by contrasting the event’s massive scale with its surprising
    ease or absence of expected drama.
  - 'Pose the central causal question: how did this begin, and how did it stop?'
  - Frame the narrative journey by jumping back in time from an origin image to the
    already-shown endpoint, then begin the story.
