hook_formula:
  duration_seconds: 30.0
  beats:
  - Open with a vivid, verifiable spectacle that sounds too strange to be true.
  - Extend it into the present to make the spectacle feel unresolved and ongoing.
  - Pivot with 'the weirdest part isn't X' to reframe the story around a more surprising
    contradiction.
  - Contrast a promised outcome with a disappointing reality, then pose the explanatory
    question the video will answer.
