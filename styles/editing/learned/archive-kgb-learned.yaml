hook_formula:
  duration_seconds: 30.0
  beats:
  - Open on a vivid, specific historical scene with immediate sensory/action detail.
  - Escalate the pressure by introducing a desperate action and an ominous unanswered
    call for help.
  - Name the central figure to anchor the scene in a recognizable subject.
  - Zoom out to promise the full origin-to-empire arc and pose a lingering mystery
    about why it survived.
