  transitions, SFX and fonts are not measured and should be set by hand. Hook (worker
  draft, agent to finalise): The Escalating Loop Cliffhanger: establish a repeating
  conflict, show it intensifying through a countable pattern, then cut off just as
  the outcome is about to land.'
