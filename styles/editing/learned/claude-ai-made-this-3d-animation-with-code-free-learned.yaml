hook_formula:
  duration_seconds: 30.0
  beats:
  - Contrast a high-performing example with the creator’s own result to create an
    immediate curiosity gap.
  - Preempt skepticism by rejecting an obvious assumption and revealing an unexpected
    method.
  - Promise a concrete roadmap of what the viewer will learn, including mistakes and
    fixes.
  - Tease an overlooked problem and imply a practical solution or payoff.
