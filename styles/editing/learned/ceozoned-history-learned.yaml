description: 'Learned from a reference video by edit_style_extractor. Measured pacing;
  transitions, SFX and fonts are not measured and should be set by hand. Hook (worker
  draft, agent to finalise): Start with an unnamed mass-scale fact, then stack a paradoxical
  origin and early-failure contrast against current dominance before naming the subject
  and promising its full history.'
