hook_formula:
  duration_seconds: 18.0
  beats:
  - Open with a staggering everyday-scale statistic about an unnamed subject to create
    curiosity.
  - Reveal a paradoxical or unlikely origin that contradicts the subject’s current
    status.
  - Contrast early failure or obscurity with present-day dominance.
  - Name the subject and promise its complete story.
