hook_formula:
  duration_seconds: 30.0
  beats:
  - Acknowledge and validate audience demand, making viewers feel their request drove
    the video.
  - Endorse the subject and frame it as worth exploring.
  - Guide viewers through a constrained mental-imagery exercise that narrows their
    focus to a familiar reference.
  - Open a curiosity loop by asserting that the image they formed is something specific,
    then cutting off before revealing it.
