hook_formula:
  duration_seconds: 30.0
  beats:
  - Ground the viewer in a hyper-specific ordinary moment to create immediacy.
  - Introduce a countdown-driven high-stakes premise with exclusive secret knowledge.
  - Trigger the inciting incident through a familiar sensory alert that states the
    stakes and deadline.
  - Add mystery by erasing the evidence, forcing the protagonist to act on uncertain
    information.
